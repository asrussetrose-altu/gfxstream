name: Parent emulator DLL - Stage 1 configure only

# Manual only. Never on push.
# Stage 1: repo init + partial sync (same 3 projects as Stage 0),
# then configure the parent emulator tree WITHOUT compiling.
# No DLL, no install, no overlay yet: the gfxstream overlay
# (minimal, gate OFF) comes at the full-build stage, not here.
# REVISION 2026-10-30 (run 41106731187): --task-list itself
# fails BEFORE listing any task: cmake.py toolchain discovery
# prints "Discovered: []" then "Build failure due to No visual
# studio with the native desktop load available for version
# '[16, 17)'" on windows-2022 image 20261025.346. The previous
# fix's task regex ALSO false-matched the echoed invocation
# line "cmake.py --ccache ..." (the \b after "cmake" matches
# before "."), so it ran a bogus "--task cmake" and failed the
# same way. This revision therefore (a) adds a VS-discovery
# diagnosis step (vswhere dump, VS install dirs, and the exact
# discovery code in cmake.py) so the next fix targets the real
# cause instead of guessing, and (b) fixes the task regex to
# ignore the "cmake.py" echo line and require a real task entry,
# and (c) reports VS-DISCOVERY-BLOCKED with exit 1 when the
# task list fails on VS discovery, instead of masking it as
# NO-CONFIGURE-TASK-FOUND.
# REVISION 2026-10-30 (run 41108179796): the diagnosis step
# PROVED the cause. vswhere -all AND -requires NativeDesktop
# both return VS Enterprise 2022 17.14.37824.6, yet aemu
# discovery prints "Discovered: []" and fails for version
# '[16, 17)'. That range is >=16 and <17, i.e. VS2019 ONLY:
# the installed VS2022 17.x is outside it, so discovery finds
# nothing even though NativeDesktop is present. This revision
# therefore (a) prints the full VS-discovery code in
# environment.py and the vswhere JSON counts for the [16,17)
# and [17,18) ranges, and (b) installs VS2019 Build Tools
# with the NativeDesktop workload when no VS2019 instance is
# found, then re-checks vswhere, before any --task-list call.
# If the VS2019 install fails, the job fails loudly there
# instead of later as VS-DISCOVERY-BLOCKED.
# REVISION 2026-10-30 (run 41109966366, main d4c3d88): fix
# attempt 2 failed on BOTH install paths. (a) The VS2019
# bootstrapper (aka.ms/vs/16/release/vs_BuildTools.exe,
# 4,422,824 bytes) exits 0 in ~30ms and creates NO
# vs2019-install.log: it never starts the installer engine.
# (b) The Chocolatey fallback fails with installer exit 87:
# "Option '/Add' is unknown. Usage: setup.exe install
# [options]" — the slash-form params were passed verbatim to
# setup.exe, which only accepts the double-dash form. (c) The
# caller grep PROVED an override exists that avoids VS2019
# entirely: aemu/platform/toolchains.py:150 returns
# self.versions.get("visual_studio_version", "[16, 17)"), i.e.
# the range comes from a toolchain config, defaulting to
# VS2019-only. This revision therefore (1) tries the override
# FIRST: locate the toolchain config, set
# visual_studio_version to "[17, 18)", and probe --task-list;
# on success the VS2019 install step is skipped via a marker
# file; (2) fixes the choco params to the double-dash form
# (--add ... --includeRecommended); (3) adds a %TEMP%
# dd_*.log diagnostic after a no-op bootstrapper run.
# REVISION 2026-10-31 (run 41111628449, main ce1d44d): fix
# attempt 3 failed for a FILENAME TYPO, not for a real VS
# reason. Its own *.json grep PRINTED the config file and its
# value — C:\emu-master-dev\external\qemu\android\build\
# toolchains.json (PLURAL): "visual_studio_version": "[16, 17)"
# — and Toolchain.__init__ opens exactly
# <aosp>/external/qemu/android/build/toolchains.json. But the
# step searched for singular "toolchain.json", found nothing,
# wrote OVERRIDE-NOT-APPLICABLE-NO-TOOLCHAIN-JSON, and never
# patched anything. The VS2019 install step then ran: choco
# SUCCEEDED (visualstudio2019buildtools 16.11.60, deployed to
# 2019\BuildTools, exit 0), yet the strict vswhere check
# (-requires NativeDesktop -version '[16,17)') still returned
# [] — consistent with the workload itself not being
# registered/installed by that choco route, not with a missing
# VS2019 directory. This revision therefore (1) fixes the
# search to toolchains.json (plural, direct path first) and
# actually patches [16,17) -> [17,18), so aemu can discover
# the already-present VS2022 Enterprise 17.14 (vswhere range
# [17,18) DID return its installationPath in run 41111628449
# step 7); (2) makes the VS2019 step NON-FATAL: it now dumps
# raw unfiltered vswhere + the vcvars64.bat existence check
# after choco and continues to the configure probe, which is
# the real VS gate (VS-DISCOVERY-BLOCKED if aemu still finds
# nothing) — a strict-check failure must no longer kill the
# job before the configure probe runs; (3) guards the override
# probe against a missing android\rebuild.cmd.
# Target labelling (unchanged): emu-master-dev is a moving
# branch, NOT a 37.2.12 pin. Any later DLL from this tree is
# "parent-built, export-compared, user-tested on 37.2.12",
# never "the 37.2.12 DLL rebuilt from source".
# Gate stays OFF: translatorSupportsGLES32() returns false.

# REVISION 2026-10-31 (run 41113776450, main c2f12a6): fix
# attempt 4 PROVED the VS fix: the [17,18) toolchains.json
# override worked — aemu discovered VS2022 Enterprise 17.14
# and the Configure task actually RAN. It then failed on a NEW
# error, not VS: "Run: None -B...objs ... in None" /
# "'None' is not recognized as an internal or external
# command" — the cmake executable resolved to Python None.
# This revision therefore (1) adds a cmake-diagnosis step
# BEFORE Configure that prints where.exe cmake, cmake
# --version, the PATH seen by the step, the cmake-executable
# resolution code in cmake.py / aemu/prebuilts/deps/windows.py,
# and any prebuilt cmake.exe under the synced tree, so the
# next fix targets the real resolver instead of guessing; and
# (2) makes Configure first put a found system cmake on PATH
# for its cmd subprocess, and choco-installs cmake if none is
# found at all, then re-runs the configure task. If configure
# still fails with None, the diagnosis output is the evidence
# for attempt 6 (e.g. a prebuilt-cmake path the partial sync
# omitted).

# REVISION 2026-10-31 (run 41114919831, main 3f91c44): fix
# attempt 5 FAILED at step 14 Configure with the SAME None
# error, but its step 13 diagnosis settled one question:
# system cmake EXISTS (C:\Program Files\CMake\bin\cmake.exe,
# 3.31.6, found by where.exe) and step 14 prepended it to PATH,
# yet rebuild still ran "None -B...objs -G Ninja". The resolver
# therefore does NOT use PATH cmake. What step 13 did NOT show:
# the launcher android\build\python\cmake.py is only
# "from aemu import cmake; cmake.launch()" — the real resolver
# lives in aemu/cmake.py, which was never printed; and the
# partial sync tree has NO prebuilts dir at all (top level is
# .repo, external, hardware only). This revision therefore
# (1) adds a resolver-dump step BEFORE Configure that prints
# aemu/cmake.py in full plus every cmake-resolution line in
# the aemu python tree, the manifest's prebuilt/cmake
# projects (repo list), and CMAKE/AEMU env vars, so attempt 7
# patches the exact resolver instead of guessing; and
# (2) makes Configure try a guarded repo sync of
# prebuilts/android-emulator-build ONLY if repo list shows it
# in the manifest (skipped otherwise, so no blind multi-GB
# download), then re-runs the configure task either way.
# If configure still fails with None, the dump output is the
# evidence for attempt 7 (patch the resolver to system cmake,
# or sync the exact prebuilt path it reads).

# REVISION 2026-10-31 (run 41116846874, main 20ae9ea): fix
# attempt 6 FAILED at step 15 Configure with the SAME None
# error, but its step 14 dump + the synced revision's own
# source settled the root cause exactly. aemu/tasks/
# configure.py (qemu ae9d18d, fetched from the AOSP mirror at
# that SHA) resolves cmake as:
#   cmake = shutil.which("cmake", path=str(aosp / "prebuilts"
#     / "cmake" / f"{platform.system().lower()}-x86" / "bin"))
# shutil.which with an explicit path= searches ONLY that
# directory and ignores PATH entirely — so attempts 5 and 6
# prepending system cmake to PATH could never work. Attempt 6
# also checked the WRONG project: prebuilts/android-
# emulator-build (only the sccache location, unused with
# --ccache none), not prebuilts/cmake; and its repo list
# greps printed nothing at all, so the manifest question is
# still open. This revision therefore (1) stages the runner's
# own system cmake into the exact path the resolver reads:
# prebuilts/cmake/windows-x86/bin/cmake.exe plus its share/
# tree (cmake locates Modules relative to the exe), and
# verifies with the identical shutil.which call before
# running Configure; (2) still prints raw repo list output
# (first 30 lines) for the record, and tries a guarded
# repo sync of prebuilts/cmake ONLY if repo list actually
# lists it — staging remains the primary fix either way.
# Staging is a build-environment workaround for Stage 1
# configure-only, not a code change; the full-build stage
# should prefer the real prebuilt cmake if it syncs.
# If Configure still fails, the next failure (e.g. ninja)
# is the new evidence for attempt 8.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-configure:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Report free disk before sync
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free
          Get-ComputerInfo | Select-Object TotalPhysicalMemory
      - name: Install repo tool (Windows form, per WINDOWS-DEV.md)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin" | Out-Null
          curl.exe -o "$env:USERPROFILE\bin\repo" http://storage.googleapis.com/git-repo-downloads/repo
          "@call python %~dp0repo %* " | Out-File -Encoding ascii "$env:USERPROFILE\bin\repo.cmd"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\bin"
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - name: Repo init and partial sync (Stage 0 proven)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\emu-master-dev | Out-Null
          Set-Location C:\emu-master-dev
          repo init -u https://android.googlesource.com/platform/manifest -b emu-master-dev --depth=1
          repo sync -j 8 external/qemu hardware/google/gfxstream hardware/google/aemu
          Get-ChildItem C:\emu-master-dev | Select-Object Name
          Get-PSDrive C | Select-Object Used, Free
      - name: Record synced HEAD SHAs
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev
          git -C external/qemu rev-parse HEAD
          git -C hardware/google/gfxstream rev-parse HEAD
          git -C hardware/google/aemu rev-parse HEAD
      - name: Diagnose Visual Studio discovery
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Output "vswhere present: $(Test-Path $vswhere) ($vswhere)"
          if (Test-Path $vswhere) {
            Write-Output '--- vswhere -all ---'
            & $vswhere -all -products * 2>&1 | Select-Object -First 40
            Write-Output '--- vswhere NativeDesktop requirement ---'
            & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop 2>&1 | Select-Object -First 40
          }
          Write-Output '--- VS install dirs ---'
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Output '--- discovery code in cmake.py tree ---'
          Set-Location C:\emu-master-dev\external\qemu
          Get-ChildItem android\build\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'native desktop|Discovered|vswhere|VisualStudio' | Select-Object -First 40 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
      - name: Print VS discovery code and version-range counts
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Write-Output '--- environment.py VS section ---'
          Get-Content android\build\python\aemu\process\environment.py -ErrorAction SilentlyContinue | Select-Object -First 160
          Write-Output '--- where visual_studio_version comes from ---'
          Select-String -Path android\build\python\cmake.py -Pattern 'visual_studio_version|VisualStudio' -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" }
          Write-Output '--- caller of get_default_environment / 16, 17 in whole build tree ---'
          Get-ChildItem android\build\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'get_default_environment|16, 17|16,17' | Select-Object -First 30 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          foreach ($range in @('[16,17)', '[17,18)')) {
            $out = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version $range -format json 2>&1 | Out-String
            Write-Output "vswhere range $range bytes=$($out.Length) head=$($out.Substring(0, [Math]::Min(200, $out.Length)))"
          }
      - name: Try VS2022 via toolchain visual_studio_version override
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Write-Output '--- toolchain config search (PLURAL toolchains.json; run 41111628449 proved singular toolchain.json misses it) ---'
          Get-ChildItem android -Filter toolchains.json -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem android -Filter *.json -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'visual_studio_version' | Select-Object -First 20 | ForEach-Object { "$($_.Path): $($_.Line.Trim())" }
          Write-Output '--- toolchains.py versions loader ---'
          Get-Content android\build\python\aemu\platform\toolchains.py -ErrorAction SilentlyContinue | Select-Object -First 160
          $cfg = 'android\build\toolchains.json'
          if (-not (Test-Path $cfg)) { $cfg = Get-ChildItem android -Filter toolchains.json -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $cfg) { Write-Output 'OVERRIDE-NOT-APPLICABLE-NO-TOOLCHAINS-JSON'; 'NA' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }
          Write-Output "toolchain config: $cfg"
          $raw = Get-Content $cfg -Raw
          if ($raw -notmatch 'visual_studio_version') { Write-Output 'OVERRIDE-NOT-APPLICABLE-NO-KEY'; 'NA' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }
          Copy-Item $cfg "$cfg.bak" -Force
          $patched = $raw -replace '"visual_studio_version"\s*:\s*"[^"]*"', '"visual_studio_version": "[17, 18)"'
          if ($patched -eq $raw) { Write-Output 'OVERRIDE-PATCH-NOOP'; 'FAILED' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }
          Set-Content $cfg $patched -NoNewline
          Write-Output 'Patched visual_studio_version to [17, 18); probing --task-list:'
          if (-not (Test-Path android\rebuild.cmd)) { Write-Output 'OVERRIDE-PROBE-FAILED-NO-REBUILD-CMD'; Get-ChildItem android | Where-Object { $_.Name -like 'rebuild*' } | Select-Object Name; 'FAILED' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }
          $list = cmd /c android\rebuild.cmd --ccache none --task-list 2>&1 | Out-String
          Write-Output $list
          if ($list -match 'No visual studio') { Write-Output 'OVERRIDE-PROBE-FAILED'; 'FAILED' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }
          Write-Output 'OVERRIDE-PROBE-OK-VS2022-DISCOVERY-PASSED'; 'OK' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"
      - name: Install VS2019 Build Tools if no VS2019 found
        shell: pwsh
        timeout-minutes: 120
        run: |
          if (Test-Path "$env:TEMP\vs-override.txt") {
            $marker = (Get-Content "$env:TEMP\vs-override.txt" -Raw).Trim()
            if ($marker -eq 'OK') { Write-Output 'SKIPPING-VS2019-INSTALL-OVERRIDE-OK'; exit 0 }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String
          if ($found -match 'installationPath') { Write-Output 'VS2019-ALREADY-PRESENT'; exit 0 }
          Write-Output 'No VS2019 instance found; installing VS2019 Build Tools (NativeDesktop workload).'
          $exe = "$env:TEMP\vs_BuildTools2019.exe"
          Invoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vs_BuildTools.exe' -OutFile $exe
          Write-Output "Bootstrapper bytes: $((Get-Item $exe).Length)"
          # Previous attempt (run 41109450340) exited 0 in <1s with no
          # install: use --quiet plus a log file, and keep the log tail
          # in the job log for diagnosis if it still does nothing.
          & $exe --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended --quiet --wait --norestart --log "$env:TEMP\vs2019-install.log"
          Write-Output "Bootstrapper exit code: $LASTEXITCODE"
          if (Test-Path "$env:TEMP\vs2019-install.log") { Get-Content "$env:TEMP\vs2019-install.log" -Tail 30 }
          else {
            Write-Output 'No vs2019-install.log; newest VS installer dd_*.log in %TEMP%:'
            Get-ChildItem $env:TEMP -Filter dd_*.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 Name, Length | ForEach-Object { Write-Output "$($_.Name) $($_.Length)"; Get-Content "$env:TEMP\$($_.Name)" -Tail 15 -ErrorAction SilentlyContinue }
          }
          $found2 = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String
          Write-Output "After bootstrapper, VS2019 vswhere bytes=$($found2.Length)"
          if (-not ($found2 -match 'installationPath')) {
            Write-Output 'Bootstrapper produced no VS2019; falling back to Chocolatey visualstudio2019buildtools.'
            # Run 41109966366 proved the slash form fails (setup.exe
            # exit 87: Option /Add unknown); use double-dash form.
            choco install visualstudio2019buildtools -y --no-progress --params "'--add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended'" 2>&1 | Select-Object -Last 60
            Write-Output "Choco exit code: $LASTEXITCODE"
            $found3 = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String
            Write-Output "After choco, VS2019 vswhere bytes=$($found3.Length)"
            $rawVs = & $vswhere -all -products * -format json 2>&1 | Out-String
            Write-Output "After choco, raw vswhere (no filters) head: $($rawVs.Substring(0, [Math]::Min(600, $rawVs.Length)))"
            $vcvars = Test-Path 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat'
            Write-Output "After choco, VS2019 vcvars64.bat present: $vcvars"
            if (-not ($found3 -match 'installationPath')) {
              Write-Output 'VS2019-INSTALL-FAILED-NONFATAL: continuing; the configure step is the real VS gate (VS-DISCOVERY-BLOCKED if aemu still finds nothing).'
              'FAILED' | Out-File -Encoding ascii "$env:TEMP\vs2019.txt"
            } else { Write-Output 'VS2019-INSTALLED' }
          }
      - name: Show rebuild entry point and help
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Get-ChildItem android | Where-Object { $_.Name -like 'rebuild*' } | Select-Object Name, Length
          if (Test-Path android\rebuild.cmd) { cmd /c android\rebuild.cmd --help }
          elseif (Test-Path android\rebuild.bat) { cmd /c android\rebuild.bat --help }
          elseif (Test-Path android\rebuild.sh) { bash android/rebuild.sh --help }
          else { Write-Output 'NO-REBUILD-WRAPPER-FOUND'; exit 1 }
      - name: List cmake tasks and features (discovery, no build)
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          cmd /c android\rebuild.cmd --ccache none --task-list
          cmd /c android\rebuild.cmd --ccache none --feature-list
      - name: Inspect cmake.py task definitions (no build)
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          $py = Get-ChildItem android -Filter cmake.py -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "cmake.py: $py"
          if ($py) { Select-String -Path $py -Pattern 'task' | Select-Object -First 60 | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" } }
      - name: Diagnose cmake executable (run 41113776450 resolved it to None)
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Write-Output '--- where cmake / version ---'
          where.exe cmake 2>&1 | Select-Object -First 5
          if (Get-Command cmake -ErrorAction SilentlyContinue) { cmake --version 2>&1 | Select-Object -First 2 }
          else { Write-Output 'NO-SYSTEM-CMAKE-ON-PATH' }
          Write-Output '--- PATH entries (first 20) ---'
          ($env:Path -split ';') | Select-Object -First 20
          Write-Output '--- cmake.py: how the cmake executable is resolved ---'
          $py = Get-ChildItem android -Filter cmake.py -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "cmake.py: $py"
          if ($py) { Select-String -Path $py -Pattern 'which|shutil|prebuilt|cmake.*exe|get_cmake|CMAKE' | Select-Object -First 40 | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" } }
          Write-Output '--- aemu prebuilts deps (windows) ---'
          Get-Content android\build\python\aemu\prebuilts\deps\windows.py -ErrorAction SilentlyContinue | Select-Object -First 120
          Write-Output '--- prebuilt cmake candidates under synced tree ---'
          Get-ChildItem C:\emu-master-dev -Filter cmake.exe -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
          Get-ChildItem android\build\cmake -ErrorAction SilentlyContinue | Select-Object Name
      - name: Dump cmake resolver code (aemu/cmake.py)
        shell: pwsh
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Write-Output '--- launcher cmake.py (full) ---'
          Get-Content android\build\python\cmake.py -ErrorAction SilentlyContinue
          Write-Output '--- aemu/cmake.py (full, first 400 lines) ---'
          Get-Content android\build\python\aemu\cmake.py -ErrorAction SilentlyContinue | Select-Object -First 400
          Write-Output '--- cmake-resolution lines in aemu python tree ---'
          Get-ChildItem android\build\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'cmake' | Where-Object { $_.Line -match 'which|prebuilt|environ|executable|bin\\|CMAKE_|get_|path' } | Select-Object -First 60 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          Write-Output '--- manifest: prebuilt/cmake projects ---'
          Set-Location C:\emu-master-dev
          repo list 2>&1 | Select-String -Pattern 'prebuilt|cmake' | Select-Object -First 20
          Write-Output '--- prebuilts dir present? ---'
          Write-Output "prebuilts exists: $(Test-Path C:\emu-master-dev\prebuilts)"
          Get-ChildItem C:\emu-master-dev -ErrorAction SilentlyContinue | Select-Object Name
          Write-Output '--- CMAKE/AEMU env vars ---'
          Get-ChildItem Env: | Where-Object { $_.Name -match 'CMAKE|AEMU' } | ForEach-Object { "$($_.Name)=$($_.Value)" }
      - name: Configure attempt (only if a configure task exists)
        shell: pwsh
        timeout-minutes: 120
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          $cmakeDir = $null
          $found = where.exe cmake 2>$null | Select-Object -First 1
          if ($found) { $cmakeDir = Split-Path $found -Parent; Write-Output "SYSTEM-CMAKE: $found" }
          else {
            Write-Output 'No system cmake; installing via Chocolatey (fallback only).'
            choco install cmake -y --no-progress 2>&1 | Select-Object -Last 10
            $found = where.exe cmake 2>$null | Select-Object -First 1
            if ($found) { $cmakeDir = Split-Path $found -Parent; Write-Output "CHOCO-CMAKE: $found" }
            else { Write-Output 'CHOCO-CMAKE-NOT-FOUND: configure will still run so its log shows the None resolver.' }
          }
          if ($cmakeDir) { $env:Path = "$cmakeDir;$env:Path"; Write-Output "PATH-PREPEND-CMAKE: $cmakeDir" }
          Write-Output '--- attempt 7: stage system cmake at the exact path the resolver reads ---'
          Write-Output 'Resolver (aemu/tasks/configure.py, qemu ae9d18d): shutil.which("cmake", path=aosp/prebuilts/cmake/windows-x86/bin) — PATH is ignored.'
          Set-Location C:\emu-master-dev
          Write-Output '--- repo list (raw, first 30 lines; attempt 6 greps printed nothing) ---'
          repo list 2>&1 | Select-Object -First 30
          $listed = repo list 2>$null | Select-String -Pattern 'prebuilts/cmake' -SimpleMatch:$false
          if ($listed) {
            Write-Output "prebuilts/cmake IS in manifest; syncing it (preferred over staging): $listed"
            repo sync -j 4 prebuilts/cmake 2>&1 | Select-Object -Last 15
          } else { Write-Output 'prebuilts/cmake not confirmed in repo list output; proceeding to staging.' }
          $destBin = 'C:\emu-master-dev\prebuilts\cmake\windows-x86\bin'
          $destShare = 'C:\emu-master-dev\prebuilts\cmake\windows-x86\share'
          if (-not (Test-Path "$destBin\cmake.exe")) {
            $sysCmake = where.exe cmake 2>$null | Select-Object -First 1
            if (-not $sysCmake) { Write-Output 'NO-SYSTEM-CMAKE-TO-STAGE'; exit 1 }
            $sysDir = Split-Path $sysCmake -Parent
            New-Item -ItemType Directory -Force -Path $destBin | Out-Null
            Copy-Item "$sysDir\*" $destBin -Recurse -Force
            $sysShare = Join-Path (Split-Path $sysDir -Parent) 'share'
            if (Test-Path $sysShare) { New-Item -ItemType Directory -Force -Path $destShare | Out-Null; Copy-Item "$sysShare\*" $destShare -Recurse -Force }
            Write-Output "STAGED-CMAKE-FROM: $sysCmake -> $destBin"
          } else { Write-Output "PREBUILT-CMAKE-ALREADY-PRESENT: $destBin\cmake.exe" }
          & "$destBin\cmake.exe" --version 2>&1 | Select-Object -First 2
          python -c "import shutil; print('RESOLVER-PROBE:', shutil.which('cmake', path=r'C:\emu-master-dev\prebuilts\cmake\windows-x86\bin'))"
          Write-Output '--- ninja on PATH (cmake -G Ninja will need it next) ---'
