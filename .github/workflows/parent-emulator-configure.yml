          $list = cmd /c android\rebuild.cmd --ccache none --task-list 2>&1 | Out-String
          Write-Output $list
          if ($list -match 'No visual studio') { Write-Output 'VS-DISCOVERY-BLOCKED'; exit 1 }
          $entries = ($list -split "`n") | Where-Object { $_ -notmatch 'cmake\.py' }
          $joined = $entries -join "`n"
          $task = $null
          foreach ($name in @('cmake', 'configure', 'config')) {
            if ($joined -match "(?m)^\s*$name\s*(:|$)") { $task = $name; break }
          }
          if (-not $task) { Write-Output 'NO-CONFIGURE-TASK-FOUND'; exit 0 }
          Write-Output "Running configure task: $task"
