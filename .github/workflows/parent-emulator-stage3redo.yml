ADY-PRESENT: $destBin\\cmake.exe\" }\n& \"$destBin\\cmake.exe\" --version 2>&1 | Select-Object -First 2\npython -c \"import shutil; print('RESOLVER-PROBE:', shutil.which('cmake', path=r'C:\\e\\prebuilts\\cmake\\windows-x86\\bin'))\"\nWrite-Output '--- ninja on PATH (cmake -G Ninja will need it next) ---'\nwhere.exe ninja 2>&1 | Select-Object -First 3\nSet-Location C:\\e\\external\\qemu\n$list = cmd /c android\\rebuild.cmd --ccache none --task-list 2>&1 | Out-String\nWrite-Output $list\nif ($list -match 'No visual studio') { Write-Output 'VS-DISCOVERY-BLOCKED'; exit 1 }\n$entries = ($list -split \"`n\") | Where-Object { $_ -notmatch 'cmake\\.py' }\n$joined = $entries -join \"`n\"\n$task = $null\nforeach ($name in @('cmake', 'configure', 'config')) {\n  if ($joined -match \"(?m)^\\s*$name\\s*(:|$)\") { $task = $name; break }\n}\nif (-not $task) { Write-Output 'NO-CONFIGURE-TASK-FOUND'; exit 0 }\nWrite-Output \"Running configure task: $task\"\ncmd /c android\\rebuild.cmd --ccache none --gfxstream_only --feature gfxstream_only --task $task\nGet-PSDrive C | Select-Object Used, Free\n"
