name: Parent emulator DLL - Stage 3 redo from Q1 pin
permissions:
  contents: read
  actions: write
jobs:
  stage3redo:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
    - name: Report free disk before sync
      shell: pwsh
      run: 'Get-PSDrive C | Select-Object Used, Free

        Get-ComputerInfo | Select-Object TotalPhysicalMemory

        '
    - name: Install repo tool (Windows form, per WINDOWS-DEV.md)
      shell: pwsh
      run: 'New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin" | Out-Null

        curl.exe -o "$env:USERPROFILE\bin\repo" http://storage.googleapis.com/git-repo-downloads/repo

        "@call python %~dp0repo %* " | Out-File -Encoding ascii "$env:USERPROFILE\bin\repo.cmd"

        Add-Content $env:GITHUB_PATH "$env:USERPROFILE\bin"

        git config --global core.autocrlf false

        git config --global core.symlinks true

        '
    - name: Attempt 23 path-length fix (short root + long paths)
      shell: pwsh
      run: 'try { Set-ItemProperty -Path ''HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'' -Name ''LongPathsEnabled'' -Value 1; Write-Output ''LONGPATHS-ENABLED'' } catch { Write-Output ''LONGPATHS-SET-FAILED-NONFATAL'' }

        git config --global core.longpaths true

        Write-Output ''LONGPATHS-GIT-SET''

        New-Item -ItemType Directory -Force -Path C:\e | Out-Null

        Write-Output ''SHORT-ROOT-READY: C:\e''

        '
    - name: Repo init and partial sync (emu-main-dev, Q1 pin base)
      shell: pwsh
      run: 'New-Item -ItemType Directory -Force -Path C:\e | Out-Null

        Set-Location C:\e

        repo init -u https://android.googlesource.com/platform/manifest -b emu-main-dev --depth=1

        repo sync -j 8 external/qemu hardware/google/gfxstream hardware/google/aemu

        Get-ChildItem C:\e | Select-Object Name

        Get-PSDrive C | Select-Object Used, Free

        '
    - name: Record synced HEAD SHAs
      shell: pwsh
      run: 'Set-Location C:\e

        git -C external/qemu rev-parse HEAD

        git -C hardware/google/gfxstream rev-parse HEAD

        git -C hardware/google/aemu rev-parse HEAD

        '
    - name: Checkout Q1 pin SHAs (emu-main-dev snaps for 16428233)
      shell: pwsh
      run: "\nSet-Location C:\\e\n$repos = @(\n  @{ Path='external/qemu'; Pin='bbaa8072362a251645b339b97a737a725c776126'; Url='https://android.googlesource.com/platform/external/qemu' },\n  @{ Path='hardware/google/gfxstream'; Pin='4695bfc87cfa9b0a4a54889583fe642145714613'; Url='https://android.googlesource.com/platform/hardware/google/gfxstream' },\n  @{ Path='hardware/google/aemu'; Pin='c305d2443de785f9ffd10f37814f4bb831d27816'; Url='https://android.googlesource.com/platform/hardware/google/aemu' }\n)\nforeach ($r in $repos) {\n  Set-Location \"C:\\e\\$($r.Path)\"\n  $cur = (git rev-parse HEAD).Trim()\n  Write-Output \"PIN-CHECKOUT repo=$($r.Path) synced_head=$cur pin=$($r.Pin)\"\n  Write-Output \"PIN-REMOTES repo=$($r.Path)\"\n  git remote -v 2>&1 | ForEach-Object { Write-Output \"PIN-REMOTE: $_\" }\n  if ($cur -eq $r.Pin) { Write-Output \"PIN-ALREADY-AT-PIN $($r.Path)\"; continue }\n  $remote = (git remote 2>$null | Select-Object -First 1)\n  if (-not $remote) { git remote add origin $r.Url 2>&1 | Select-Object -Last 3; $remote = 'origin'; Write-Output \"PIN-REMOTE-ADDED origin $($r.Url)\" }\n  Write-Output \"PIN-REMOTE-USED repo=$($r.Path) remote=$remote url=$($r.Url)\"\n  git fetch $remote $r.Pin 2>&1 | Select-Object -Last 5\n  git cat-file -e \"$($r.Pin)^{commit}\" 2>$null\n  $ok = ($LASTEXITCODE -eq 0)\n  if (-not $ok) {\n    foreach ($depth in @(100, 500, 2000)) {\n      git fetch --deepen=$depth $remote 2>&1 | Select-Object -Last 3\n      git cat-file -e \"$($r.Pin)^{commit}\" 2>$null\n      if ($LASTEXITCODE -eq 0) { $ok = $true; break }\n      Write-Output \"PIN-DEEPEN repo=$($r.Path) depth=$depth found=$ok\"\n    }\n  }\n  if (-not $ok) {\n    git fetch --unshallow $remote 2>&1 | Select-Object -Last 3\n    git cat-file -e \"$($r.Pin)^{commit}\" 2>$null\n    $ok = ($LASTEXITCODE -eq 0)\n  }\n  if (-not $ok) { Write-Output \"PIN-CHECKOUT-FAILED repo=$($r.Path) pin=$($r.Pin)\"; exit 1 }\n  git checkout $r.Pin 2>&1 | Select-Object -Last 5\n  $after = (git rev-parse HEAD).Trim()\n  Write-Output \"PIN-CHECKED-OUT repo=$($r.Path) head=$after\"\n  if ($after -ne $r.Pin) { Write-Output \"PIN-MISMATCH repo=$($r.Path)\"; exit 1 }\n}\nWrite-Output 'PIN-CHECKOUT-ALL-OK'\nGet-PSDrive C | Select-Object Used, Free\n"
    - name: Verify Q1 pin SHAs actually synced
      shell: pwsh
      run: "\nSet-Location C:\\e\n$want = @{ 'external/qemu'='bbaa8072362a251645b339b97a737a725c776126'; 'hardware/google/gfxstream'='4695bfc87cfa9b0a4a54889583fe642145714613'; 'hardware/google/aemu'='c305d2443de785f9ffd10f37814f4bb831d27816' }\nforeach ($p in $want.Keys) {\n  $got = (git -C $p rev-parse HEAD).Trim()\n  Write-Output \"PIN-VERIFY repo=$p head=$got want=$($want[$p])\"\n  if ($got -ne $want[$p]) { Write-Output \"PIN-VERIFY-FAILED repo=$p\"; exit 1 }\n}\nWrite-Output 'PIN-VERIFY-ALL-MATCH'\n"
    - name: Diagnose Visual Studio discovery
      shell: pwsh
      run: "$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\nWrite-Output \"vswhere present: $(Test-Path $vswhere) ($vswhere)\"\nif (Test-Path $vswhere) {\n  Write-Output '--- vswhere -all ---'\n  & $vswhere -all -products * 2>&1 | Select-Object -First 40\n  Write-Output '--- vswhere NativeDesktop requirement ---'\n  & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop 2>&1 | Select-Object -First 40\n}\nWrite-Output '--- VS install dirs ---'\nGet-ChildItem \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\" -ErrorAction SilentlyContinue | Select-Object Name\nGet-ChildItem \"C:\\Program Files\\Microsoft Visual Studio\" -ErrorAction SilentlyContinue | Select-Object Name\nWrite-Output '--- discovery code in cmake.py tree ---'\nSet-Location C:\\e\\external\\qemu\nGet-ChildItem android\\build\\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'native desktop|Discovered|vswhere|VisualStudio' | Select-Object -First 40 | ForEach-Object { \"$($_.Path):$($_.LineNumber): $($_.Line.Trim())\" }\n"
    - name: Print VS discovery code and version-range counts
      shell: pwsh
      run: "Set-Location C:\\e\\external\\qemu\nWrite-Output '--- environment.py VS section ---'\nGet-Content android\\build\\python\\aemu\\process\\environment.py -ErrorAction SilentlyContinue | Select-Object -First 160\nWrite-Output '--- where visual_studio_version comes from ---'\nSelect-String -Path android\\build\\python\\cmake.py -Pattern 'visual_studio_version|VisualStudio' -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" }\nWrite-Output '--- caller of get_default_environment / 16, 17 in whole build tree ---'\nGet-ChildItem android\\build\\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern 'get_default_environment|16, 17|16,17' | Select-Object -First 30 | ForEach-Object { \"$($_.Path):$($_.LineNumber): $($_.Line.Trim())\" }\n$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\nforeach ($range in @('[16,17)', '[17,18)')) {\n  $out = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version $range -format json 2>&1 | Out-String\n  Write-Output \"vswhere range $range bytes=$($out.Length) head=$($out.Substring(0, [Math]::Min(200, $out.Length)))\"\n}\n"
    - name: Try VS2022 via toolchain visual_studio_version override
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        Write-Output ''--- toolchain config search (PLURAL toolchains.json; run 41111628449 proved singular toolchain.json misses it) ---''

        Get-ChildItem android -Filter toolchains.json -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

        Get-ChildItem android -Filter *.json -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern ''visual_studio_version'' | Select-Object -First 20 | ForEach-Object { "$($_.Path): $($_.Line.Trim())" }

        Write-Output ''--- toolchains.py versions loader ---''

        Get-Content android\build\python\aemu\platform\toolchains.py -ErrorAction SilentlyContinue | Select-Object -First 160

        $cfg = ''android\build\toolchains.json''

        if (-not (Test-Path $cfg)) { $cfg = Get-ChildItem android -Filter toolchains.json -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }

        if (-not $cfg) { Write-Output ''OVERRIDE-NOT-APPLICABLE-NO-TOOLCHAINS-JSON''; ''NA'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }

        Write-Output "toolchain config: $cfg"

        $raw = Get-Content $cfg -Raw

        if ($raw -notmatch ''visual_studio_version'') { Write-Output ''OVERRIDE-NOT-APPLICABLE-NO-KEY''; ''NA'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }

        Copy-Item $cfg "$cfg.bak" -Force

        $patched = $raw -replace ''"visual_studio_version"\s*:\s*"[^"]*"'', ''"visual_studio_version": "[17, 18)"''

        if ($patched -eq $raw) { Write-Output ''OVERRIDE-PATCH-NOOP''; ''FAILED'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }

        Set-Content $cfg $patched -NoNewline

        Write-Output ''Patched visual_studio_version to [17, 18); probing --task-list:''

        if (-not (Test-Path android\rebuild.cmd)) { Write-Output ''OVERRIDE-PROBE-FAILED-NO-REBUILD-CMD''; Get-ChildItem android | Where-Object { $_.Name -like ''rebuild*'' } | Select-Object Name; ''FAILED'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }

        $list = cmd /c android\rebuild.cmd --ccache none --task-list 2>&1 | Out-String

        Write-Output $list

        if ($list -match ''No visual studio'') { Write-Output ''OVERRIDE-PROBE-FAILED''; ''FAILED'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"; exit 0 }

        Write-Output ''OVERRIDE-PROBE-OK-VS2022-DISCOVERY-PASSED''; ''OK'' | Out-File -Encoding ascii "$env:TEMP\vs-override.txt"

        '
    - name: Install VS2019 Build Tools if no VS2019 found
      shell: pwsh
      timeout-minutes: 120
      run: "if (Test-Path \"$env:TEMP\\vs-override.txt\") {\n  $marker = (Get-Content \"$env:TEMP\\vs-override.txt\" -Raw).Trim()\n  if ($marker -eq 'OK') { Write-Output 'SKIPPING-VS2019-INSTALL-OVERRIDE-OK'; exit 0 }\n}\n$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\n$found = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String\nif ($found -match 'installationPath') { Write-Output 'VS2019-ALREADY-PRESENT'; exit 0 }\nWrite-Output 'No VS2019 instance found; installing VS2019 Build Tools (NativeDesktop workload).'\n$exe = \"$env:TEMP\\vs_BuildTools2019.exe\"\nInvoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vs_BuildTools.exe' -OutFile $exe\nWrite-Output \"Bootstrapper bytes: $((Get-Item $exe).Length)\"\n# Previous attempt (run 41109450340) exited 0 in <1s with no\n# install: use --quiet plus a log file, and keep the log tail\n# in the job log for diagnosis if it still does nothing.\n& $exe --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended --quiet --wait --norestart --log \"$env:TEMP\\vs2019-install.log\"\nWrite-Output \"Bootstrapper exit code: $LASTEXITCODE\"\nif (Test-Path \"$env:TEMP\\vs2019-install.log\") { Get-Content \"$env:TEMP\\vs2019-install.log\" -Tail 30 }\nelse {\n  Write-Output 'No vs2019-install.log; newest VS installer dd_*.log in %TEMP%:'\n  Get-ChildItem $env:TEMP -Filter dd_*.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 Name, Length | ForEach-Object { Write-Output \"$($_.Name) $($_.Length)\"; Get-Content \"$env:TEMP\\$($_.Name)\" -Tail 15 -ErrorAction SilentlyContinue }\n}\n$found2 = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String\nWrite-Output \"After bootstrapper, VS2019 vswhere bytes=$($found2.Length)\"\nif (-not ($found2 -match 'installationPath')) {\n  Write-Output 'Bootstrapper produced no VS2019; falling back to Chocolatey visualstudio2019buildtools.'\n  # Run 41109966366 proved the slash form fails (setup.exe\n  # exit 87: Option /Add unknown); use double-dash form.\n  choco install visualstudio2019buildtools -y --no-progress --params \"'--add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended'\" 2>&1 | Select-Object -Last 60\n  Write-Output \"Choco exit code: $LASTEXITCODE\"\n  $found3 = & $vswhere -all -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -version '[16,17)' -format json 2>&1 | Out-String\n  Write-Output \"After choco, VS2019 vswhere bytes=$($found3.Length)\"\n  $rawVs = & $vswhere -all -products * -format json 2>&1 | Out-String\n  Write-Output \"After choco, raw vswhere (no filters) head: $($rawVs.Substring(0, [Math]::Min(600, $rawVs.Length)))\"\n  $vcvars = Test-Path 'C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat'\n  Write-Output \"After choco, VS2019 vcvars64.bat present: $vcvars\"\n  if (-not ($found3 -match 'installationPath')) {\n    Write-Output 'VS2019-INSTALL-FAILED-NONFATAL: continuing; the configure step is the real VS gate (VS-DISCOVERY-BLOCKED if aemu still finds nothing).'\n    'FAILED' | Out-File -Encoding ascii \"$env:TEMP\\vs2019.txt\"\n  } else { Write-Output 'VS2019-INSTALLED' }\n}\n"
    - name: Show rebuild entry point and help
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        Get-ChildItem android | Where-Object { $_.Name -like ''rebuild*'' } | Select-Object Name, Length

        if (Test-Path android\rebuild.cmd) { cmd /c android\rebuild.cmd --help }

        elseif (Test-Path android\rebuild.bat) { cmd /c android\rebuild.bat --help }

        elseif (Test-Path android\rebuild.sh) { bash android/rebuild.sh --help }

        else { Write-Output ''NO-REBUILD-WRAPPER-FOUND''; exit 1 }

        '
    - name: List cmake tasks and features (discovery, no build)
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        cmd /c android\rebuild.cmd --ccache none --task-list

        cmd /c android\rebuild.cmd --ccache none --feature-list

        '
    - name: Inspect cmake.py task definitions (no build)
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        $py = Get-ChildItem android -Filter cmake.py -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

        Write-Output "cmake.py: $py"

        if ($py) { Select-String -Path $py -Pattern ''task'' | Select-Object -First 60 | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" } }

        '
    - name: Diagnose cmake executable (run 41113776450 resolved it to None)
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        Write-Output ''--- where cmake / version ---''

        where.exe cmake 2>&1 | Select-Object -First 5

        if (Get-Command cmake -ErrorAction SilentlyContinue) { cmake --version 2>&1 | Select-Object -First 2 }

        else { Write-Output ''NO-SYSTEM-CMAKE-ON-PATH'' }

        Write-Output ''--- PATH entries (first 20) ---''

        ($env:Path -split '';'') | Select-Object -First 20

        Write-Output ''--- cmake.py: how the cmake executable is resolved ---''

        $py = Get-ChildItem android -Filter cmake.py -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

        Write-Output "cmake.py: $py"

        if ($py) { Select-String -Path $py -Pattern ''which|shutil|prebuilt|cmake.*exe|get_cmake|CMAKE'' | Select-Object -First 40 | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" } }

        Write-Output ''--- aemu prebuilts deps (windows) ---''

        Get-Content android\build\python\aemu\prebuilts\deps\windows.py -ErrorAction SilentlyContinue | Select-Object -First 120

        Write-Output ''--- prebuilt cmake candidates under synced tree ---''

        Get-ChildItem C:\e -Filter cmake.exe -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 10 FullName

        Get-ChildItem android\build\cmake -ErrorAction SilentlyContinue | Select-Object Name

        '
    - name: Dump cmake resolver code (aemu/cmake.py)
      shell: pwsh
      run: 'Set-Location C:\e\external\qemu

        Write-Output ''--- launcher cmake.py (full) ---''

        Get-Content android\build\python\cmake.py -ErrorAction SilentlyContinue

        Write-Output ''--- aemu/cmake.py (full, first 400 lines) ---''

        Get-Content android\build\python\aemu\cmake.py -ErrorAction SilentlyContinue | Select-Object -First 400

        Write-Output ''--- cmake-resolution lines in aemu python tree ---''

        Get-ChildItem android\build\python -Filter *.py -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern ''cmake'' | Where-Object { $_.Line -match ''which|prebuilt|environ|executable|bin\\|CMAKE_|get_|path'' } | Select-Object -First 60 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }

        Write-Output ''--- manifest: prebuilt/cmake projects ---''

        Set-Location C:\e

        repo list 2>&1 | Select-String -Pattern ''prebuilt|cmake'' | Select-Object -First 20

        Write-Output ''--- prebuilts dir present? ---''

        Write-Output "prebuilts exists: $(Test-Path C:\e\prebuilts)"

        Get-ChildItem C:\e -ErrorAction SilentlyContinue | Select-Object Name

        Write-Output ''--- CMAKE/AEMU env vars ---''

        Get-ChildItem Env: | Where-Object { $_.Name -match ''CMAKE|AEMU'' } | ForEach-Object { "$($_.Name)=$($_.Value)" }

        '
    - name: Sync Windows prebuilts (clang + cmake, attempt 8)
      shell: pwsh
      run: 'Set-Location C:\e

        Write-Output ''--- attempt 8: explicit sync of platform-windows prebuilts ---''

        Write-Output ''Manifest groups them notdefault,platform-windows, so the default sync skipped them.''

        repo sync -j 4 prebuilts/clang/host/windows-x86 prebuilts/cmake/windows-x86 2>&1 | Select-Object -Last 20

        $clang = ''C:\e\prebuilts\clang\host\windows-x86\clang-r530567\bin\clang-cl.exe''

        $cmake = ''C:\e\prebuilts\cmake\windows-x86\bin\cmake.exe''

        Write-Output "CLANG-CL-EXISTS: $(Test-Path $clang) ($clang)"

        if (Test-Path $clang) { (Get-Item $clang).Length }

        Write-Output "PREBUILT-CMAKE-EXISTS: $(Test-Path $cmake) ($cmake)"

        if (Test-Path $cmake) { & $cmake --version 2>&1 | Select-Object -First 1 }

        Get-PSDrive C | Select-Object Used, Free

        '
    - name: Sync qemu-android-deps prebuilt (attempt 11)
      shell: pwsh
      run: "Set-Location C:\\e\nWrite-Output '--- attempt 11: manifest evidence (attempt 10 line 64: full project path) ---'\nif (Test-Path .repo\\manifests\\default.xml) { Select-String -Path .repo\\manifests\\default.xml -Pattern 'qemu-android-deps' | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" } } else { Write-Output 'NO-DEFAULT-XML' }\n$pixman = 'C:\\e\\prebuilts\\android-emulator-build\\qemu-android-deps\\windows_msvc-x86_64\\include\\pixman-1'\nWrite-Output '--- try repo sync by FULL project path (attempts 9/10 synced the parent prefix, not a project) ---'\nrepo sync -j 4 prebuilts/android-emulator-build/qemu-android-deps 2>&1 | Select-Object -Last 10\nWrite-Output \"repo sync by full path exit code: $LASTEXITCODE\"\nif (-not (Test-Path $pixman)) {\n  Write-Output '--- fallback: repo sync by FULL project name ---'\n  repo sync -j 4 platform/prebuilts/android-emulator-build/qemu-android-deps 2>&1 | Select-Object -Last 10\n  Write-Output \"repo sync by full name exit code: $LASTEXITCODE\"\n}\nif (-not (Test-Path $pixman)) {\n  Write-Output '--- fallback: shallow git clone of the qemu-android-deps repo itself (not the parent) ---'\n  Remove-Item -Recurse -Force C:\\e\\prebuilts\\android-emulator-build\\qemu-android-deps -ErrorAction SilentlyContinue\n  git clone --depth 1 https://android.googlesource.com/platform/prebuilts/android-emulator-build/qemu-android-deps C:\\e\\prebuilts\\android-emulator-build\\qemu-android-deps 2>&1 | Select-Object -Last 10\n  Write-Output \"git clone qemu-android-deps exit code: $LASTEXITCODE\"\n}\nWrite-Output \"PIXMAN-INCLUDE-EXISTS: $(Test-Path $pixman) ($pixman)\"\nif (Test-Path $pixman) { Get-ChildItem $pixman | Select-Object -First 5 Name }\n$depsRoot = 'C:\\e\\prebuilts\\android-emulator-build\\qemu-android-deps\\windows_msvc-x86_64'\nWrite-Output \"QEMU-ANDROID-DEPS-ROOT-EXISTS: $(Test-Path $depsRoot)\"\nif (Test-Path $depsRoot) { Get-ChildItem $depsRoot | Select-Object -First 20 Name }\nif (-not (Test-Path $pixman)) { Write-Output 'QEMU-ANDROID-DEPS-MISSING: pixman include dir absent after full-path sync + full-name sync + clone of the qemu-android-deps repo; Configure would fail at prebuilts.cmake:119.'; exit 1 }\nGet-PSDrive C | Select-Object Used, Free\n"
    - name: Sync android-emulator-build common prebuilts (attempt 12)
      shell: pwsh
      run: "Set-Location C:\\e\nWrite-Output '--- attempt 12: manifest evidence (all android-emulator-build projects) ---'\nif (Test-Path .repo\\manifests\\default.xml) { Select-String -Path .repo\\manifests\\default.xml -Pattern 'android-emulator-build' | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" } } else { Write-Output 'NO-DEFAULT-XML' }\n$virgl = 'C:\\e\\prebuilts\\android-emulator-build\\common\\virglrenderer\\windows_msvc-x86_64\\include\\virgl'\nWrite-Output 'FIX2: no batch sync of all android-emulator-build projects (run 41695848606 filled disk, Errno 28, syncing system-images/qt/mesa/archive); only common is synced, via the fallbacks below, and only if virgl is missing'\nif (-not (Test-Path $virgl)) {\n  Write-Output '--- fallback: repo sync common by path ---'\n  repo sync -j 4 prebuilts/android-emulator-build/common 2>&1 | Select-Object -Last 10\n  Write-Output \"repo sync common by path exit code: $LASTEXITCODE\"\n}\nif (-not (Test-Path $virgl)) {\n  Write-Output '--- fallback: repo sync common by name ---'\n  repo sync -j 4 platform/prebuilts/android-emulator-build/common 2>&1 | Select-Object -Last 10\n  Write-Output \"repo sync common by name exit code: $LASTEXITCODE\"\n}\nif (-not (Test-Path $virgl)) {\n  Write-Output '--- fallback: shallow git clone of the common repo itself ---'\n  Remove-Item -Recurse -Force C:\\e\\prebuilts\\android-emulator-build\\common -ErrorAction SilentlyContinue\n  git clone --depth 1 https://android.googlesource.com/platform/prebuilts/android-emulator-build/common C:\\e\\prebuilts\\android-emulator-build\\common 2>&1 | Select-Object -Last 10\n  Write-Output \"git clone common exit code: $LASTEXITCODE\"\n}\nWrite-Output \"VIRGL-INCLUDE-EXISTS: $(Test-Path $virgl) ($virgl)\"\nif (Test-Path $virgl) { Get-ChildItem $virgl | Select-Object -First 5 Name }\nif (-not (Test-Path $virgl)) { Write-Output 'COMMON-VIRGL-MISSING: virgl include dir absent after manifest-project sync + path/name sync + clone; Configure would fail at prebuilts.cmake:119.'; exit 1 }\nGet-PSDrive C | Select-Object Used, Free\n"
