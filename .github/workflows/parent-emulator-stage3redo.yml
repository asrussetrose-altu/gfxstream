    - name: Stage 3 redo lz4 stdlib include (adaptive, synced tree only)
      shell: pwsh
      run: "\nSet-Location C:\\e\n$found = Get-ChildItem C:\\e -Filter threadpool.c -Recurse -Depth 5 -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'lz4' } | Select-Object -First 1 -ExpandProperty FullName\nif (-not $found) { Write-Output 'REDO-THREADPOOL-NOT-FOUND (non-fatal; compile is the judge)'; exit 0 }\nWrite-Output \"REDO-THREADPOOL: $found\"\n$lines = Get-Content $found\n$condIdx = -1\nfor ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^\\s*#\\s*(if|ifdef|ifndef|elif|else|endif)\\b') { $condIdx = $i; break } }\nif ($condIdx -lt 0) { $condIdx = $lines.Count }\n$head = @()\nif ($condIdx -gt 0) { $head = $lines[0..($condIdx - 1)] }\n$uncond = $head | Where-Object { $_ -match '^\\s*#include\\s*<stdlib\\.h>' }\nif ($uncond) { Write-Output 'REDO-UNCONDITIONAL-STDLIB-ALREADY-PRESENT' }\nelse {\n  $idx = -1\n  for ($i = 0; $i -lt $head.Count; $i++) { if ($head[$i] -match '^\\s*#include') { $idx = $i; break } }\n  if ($idx -lt 0) { $lines = @('#include <stdlib.h>') + $lines } else { $lines = $lines[0..$idx] + '#include <stdlib.h>' + $lines[($idx + 1)..($lines.Count - 1)] }\n  Set-Content $found $lines\n  Write-Output 'REDO-UNCONDITIONAL-STDLIB-INSERTED'\n}\nSelect-String -Path $found -Pattern 'stdlib\\.h' | ForEach-Object { Write-Output \"REDO-STDLIB-LINE: $($_.LineNumber): $($_.Line.Trim())\" }\n"
