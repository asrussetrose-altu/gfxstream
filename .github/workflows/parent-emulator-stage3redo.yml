      shell: pwsh
      timeout-minutes: 120
      run: "\nSet-Location 'C:\\e\\external\\qemu\\objs'\n$n = (where.exe ninja 2>$null | Select-Object -First 1)\nif (-not $n) { $cand = Get-ChildItem C:\\e\\prebuilts -Filter ninja.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName; if ($cand) { $n = $cand } else { $n = 'ninja' } }\nWrite-Output \"REDO-BUILD ninja_exe=$n\"\n& $n --version 2>&1 | Select-Object -First 1\n$ninjaFile = 'C:\\e\\external\\qemu\\objs\\build.ninja'\n$targets = @()\n$bl = Select-String -Path $ninjaFile -Pattern '^build\\s+(\\S*gfxstream_backend\\.dll)\\s*:' | Select-Object -First 1\nif ($bl) { if ($bl.Line -match '^build\\s+(\\S+)') { $targets += $Matches[1]; Write-Output \"REDO-BUILD backend_target=$($Matches[1])\" } }\nforeach ($dll in @('libandroid-emu-base-logging.dll', 'libandroid-emu-agents.dll', 'libandroid-emu-protos.dll', 'libandroid-emu-metrics.dll', 'libabseil_dll.dll', 'liblibprotobuf.dll')) {\n  $m = Select-String -Path $ninjaFile -Pattern \"^build\\s+(\\S*$([regex]::Escape($dll)))\\s*:\" | Select-Object -First 1\n  if ($m) { if ($m.Line -match '^build\\s+(\\S+)') { $targets += $Matches[1]; Write-Output \"REDO-BUILD sibling_target dll=$dll target=$($Matches[1])\" } } else { Write-Output \"REDO-BUILD sibling_target dll=$dll target=NOT-FOUND\" }\n}\nif (-not $targets) { Write-Output 'REDO-BUILD-NO-TARGETS'; exit 1 }\nWrite-Output \"REDO-BUILD targets=$($targets -join ' ')\"\nWrite-Output '--- dry run ---'\n$dry = & $n -n $targets 2>&1 | Out-String\n$dryLines = ($dry -split \"`n\").Count\nWrite-Output \"REDO-BUILD dryrun_lines=$dryLines\"\n$dry -split \"`n\" | Select-Object -First 80 | ForEach-Object { Write-Output \"REDO-BUILD dryrun: $_\" }\nif ($dryLines -gt 3000) { Write-Output 'REDO-BUILD-DRYRUN-EXPANDED (over 3000 planned edges; refusing to risk a full-graph build)'; exit 1 }\nif ($dry -match 'qemu-system-.*\\.exe') { Write-Output 'REDO-BUILD-DRYRUN-PULLS-QEMU-SYSTEM (refusing)'; exit 1 }\nGet-PSDrive C | Select-Object Used, Free\nWrite-Output \"REDO-BUILD free_disk_before_bytes=$((Get-PSDrive C).Free)\"\n& $n $targets 2>&1 | Select-Object -Last 60\n$code = $LASTEXITCODE\nWrite-Output \"REDO-BUILD ninja_exit_code=$code\"\nGet-PSDrive C | Select-Object Used, Free\nWrite-Output \"REDO-BUILD free_disk_after_bytes=$((Get-PSDrive C).Free)\"\nif ($code -ne 0) { Write-Output 'REDO-BUILD-FAILED (R1: non-clean build is not a deliverable; no tolerance applied)'; exit 1 }\nWrite-Output 'REDO-BUILD-OK (clean ninja exit 0)'\nforeach ($t in $targets) { $p = Join-Path 'C:\\e\\external\\qemu\\objs' $t; if (Test-Path $p) { $it = Get-Item $p; Write-Output \"REDO-BUILT target=$t bytes=$($it.Length)\"; (Get-FileHash $p -Algorithm SHA256).Hash } else { Write-Output \"REDO-BUILT-MISSING target=$t\" } }\n"
    - name: Stage 3 redo locate backend DLL
      if: steps.symgrep.outputs.gate_pass == 'true'
      shell: pwsh
      run: "\n$found = Get-ChildItem C:\\e\\external\\qemu\\objs -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'libgfxstream_backend.dll' -or $_.Name -eq 'gfxstream_backend.dll' } | Select-Object -ExpandProperty FullName\nWrite-Output \"REDO-LOCATE found_count=$($found.Count)\"\nforeach ($f in $found) { $item = Get-Item $f; Write-Output \"$f $($item.Length)\" }\nif (-not $found) { Write-Output 'REDO-LOCATE-DLL-NOT-FOUND'; exit 1 }\n$preferred = $found | Where-Object { $_ -like '*distribution*emulator*' } | Select-Object -First 1\nif (-not $preferred) { $preferred = $found | Select-Object -First 1; Write-Output 'REDO-LOCATE-NOTE: candidate is an intermediate objs link, not a distribution link (weaker provenance, R4)' } else { Write-Output 'REDO-LOCATE-NOTE: candidate is a distribution link' }\nWrite-Output \"REDO-LOCATE selected=$preferred\"\nCopy-Item $preferred \"$env:GITHUB_WORKSPACE\\libgfxstream_backend.dll\" -Force\n$item = Get-Item \"$env:GITHUB_WORKSPACE\\libgfxstream_backend.dll\"\nWrite-Output \"REDO-LOCATE size=$($item.Length)\"\n(Get-FileHash \"$env:GITHUB_WORKSPACE\\libgfxstream_backend.dll\" -Algorithm SHA256).Hash\nforeach ($dll in @('libandroid-emu-base-logging.dll', 'libandroid-emu-agents.dll', 'libandroid-emu-protos.dll', 'libandroid-emu-metrics.dll', 'libabseil_dll.dll', 'liblibprotobuf.dll')) {\n  $sib = Get-ChildItem C:\\e\\external\\qemu\\objs -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq $dll } | Select-Object -First 1\n  if ($sib) { Write-Output \"REDO-LOCATE sibling=$dll path=$($sib.FullName) bytes=$($sib.Length)\" } else { Write-Output \"REDO-LOCATE sibling=$dll NOT-FOUND\" }\n}\n"
    - name: Upload stage3redo backend DLL artifact
      if: steps.symgrep.outputs.gate_pass == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: libgfxstream_backend-stage3redo
        path: libgfxstream_backend.dll
        retention-days: 30
'on':
  workflow_dispatch: null
