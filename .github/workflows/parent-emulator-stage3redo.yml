    - name: Stage 3 redo symbol grep (gate G-3a1, pin tree)
      id: symgrep
      shell: pwsh
      run: "\n$symbols = @('gfxstream_backend_set_screen_background', 'stream_renderer_get_metrics')\n$roots = @('C:\\e\\external\\qemu', 'C:\\e\\hardware\\google\\gfxstream', 'C:\\e\\hardware\\google\\aemu')\n$defs = @()\n$allHits = 0\nforeach ($sym in $symbols) {\n  $defCount = 0\n  foreach ($root in $roots) {\n    $hits = @()\n    if (Test-Path $root) {\n      $out = & git -C $root grep -n -I -- $sym -- '*.cpp' '*.h' '*.hpp' '*.c' '*.cc' '*.cxx' '*.def' 2>$null\n      if ($out) { $hits = @($out) }\n      if (-not $hits) {\n        $ss = Get-ChildItem $root -Recurse -File -Include *.cpp,*.h,*.hpp,*.c,*.cc,*.cxx,*.def -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\\\(\\.git|\\.repo|objs)\\\\' } | Select-String -Pattern $sym -ErrorAction SilentlyContinue\n        foreach ($m in $ss) { $hits += \"$($m.Path):$($m.LineNumber):$($m.Line.Trim())\" }\n      }\n    }\n    $cache = @{}\n    foreach ($h in $hits) {\n      $allHits++\n      $parts = $h -split ':', 3\n      if ($parts.Count -lt 3) { continue }\n      $rel = $parts[0]; $ln = $parts[1]; $txt = $parts[2]\n      $full = Join-Path $root $rel\n      if (-not $cache.ContainsKey($full)) { if (Test-Path $full) { $cache[$full] = @(Get-Content $full -ErrorAction SilentlyContinue) } else { $cache[$full] = @() } }\n      $lines = $cache[$full]\n      $idx = 0; if ($ln -match '^\\d+$') { $idx = [int]$ln - 1 }\n      $block = ''\n      for ($k = $idx; $k -lt [Math]::Min($lines.Count, $idx + 4); $k++) { $block += $lines[$k] + \"`n\"; if ($lines[$k] -match '[{;]') { break } }\n      $cls = 'CALL-SITE-OR-OTHER'\n      if ($block -match '\\{') { if ($block.IndexOf('{') -lt ($block.IndexOf(';') -eq -1 ? $block.Length : $block.IndexOf(';'))) { $cls = 'DEFINITION' } }\n      if ($cls -ne 'DEFINITION' -and $block -match ';') { $cls = 'DECLARATION' }\n      if ($cls -eq 'DEFINITION') { $defCount++; $defs += \"$sym|$root|$rel|$ln\" }\n      Write-Output \"REDO-SYMBOL-GREP symbol=$sym root=$root file=$rel line=$ln class=$cls text=$($txt.Trim())\"\n    }\n  }\n  Write-Output \"REDO-SYMBOL-GREP-SUMMARY symbol=$sym definition_hits=$defCount\"\n  if ($defCount -eq 0) { Write-Output \"REDO-STOP-SYMBOL-ABSENT-FROM-PIN $sym\" }\n}\nWrite-Output \"REDO-SYMBOL-GREP-TOTAL-HITS $allHits\"\n$gate = $true\nforeach ($sym in $symbols) { if (-not ($defs -match \"^$sym\\|\")) { $gate = $false } }\n$defs | Out-File -FilePath \"$env:GITHUB_WORKSPACE\\stage3redo-definitions.txt\" -Encoding utf8\n\"gate_pass=$($gate.ToString().ToLower())\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8\nWrite-Output \"REDO-GATE-G-3a1 gate_pass=$($gate.ToString().ToLower())\"\n$LASTEXITCODE = 0\n"
