name: Build Windows libgfxstream_backend.dll

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows-dll.yml'
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.c'
      - '**/*.h'
      - '**/*.hpp'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          msbuild -version
          $vs = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin\clang-cl.exe' -ErrorAction SilentlyContinue
          if (-not $vs) {
            throw 'Visual Studio ClangCL toolset was not found on this runner.'
          }
          & $vs.FullName --version

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build backend
        run: cmake --build build --config Release --target gfxstream_backend --parallel

      - name: Collect backend DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'gfxstream_backend.dll' |
            Select-Object -First 1
          if (-not $dll) {
            throw 'gfxstream_backend.dll was not produced by the build.'
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'artifact/libgfxstream_backend.dll'
          Write-Host "Collected: $($dll.FullName)"
          Get-FileHash 'artifact/libgfxstream_backend.dll' -Algorithm SHA256

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: libgfxstream_backend-windows
          path: artifact/libgfxstream_backend.dll
          if-no-files-found: error
