name: Build Windows libgfxstream_backend.dll

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows-dll.yml'
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.c'
      - '**/*.h'
      - '**/*.hpp'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio Installer vswhere.exe was not found."
          }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) {
            throw "No Visual Studio 2022 installation was detected."
          }
          Write-Host "Visual Studio: $vsPath"
          $clang = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\Llvm\bin') -Filter 'clang-cl.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $clang) {
            throw "The Visual Studio ClangCL toolset is missing from $vsPath."
          }
          & $clang.FullName --version
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build backend
        run: cmake --build build --config Release --target gfxstream_backend --parallel

      - name: Collect backend DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'gfxstream_backend.dll' |
            Select-Object -First 1
          if (-not $dll) {
            throw 'gfxstream_backend.dll was not produced by the build.'
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'artifact/libgfxstream_backend.dll'
          Write-Host "Collected: $($dll.FullName)"
          Get-FileHash 'artifact/libgfxstream_backend.dll' -Algorithm SHA256

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: libgfxstream_backend-windows
          path: artifact/libgfxstream_backend.dll
          if-no-files-found: error
