name: Build Windows libgfxstream_backend.dll

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure with CMake (Ninja + ClangCL)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd build
          ninja gfxstream_backend

      - name: Find and upload DLL
        shell: bash
        run: |
          find build -name "*.dll" || true
          mkdir -p artifact
          find build -name "*gfxstream_backend*.dll" -exec cp {} artifact/ \; || true
          find build -name "*.dll" -exec cp {} artifact/ \; || true
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgfxstream_backend-windows
          path: artifact/
          if-no-files-found: warn
