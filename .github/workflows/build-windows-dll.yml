name: Build Windows libgfxstream_backend.dll

on:
  workflow_dispatch:          # Manual button
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force GLES 3.2 (simple patch)
        shell: bash
        run: |
          # Force the detector to report 3.2
          if [ -f host/gl/GLESVersionDetector.cpp ]; then
            sed -i 's/GLES_DISPATCH_MAX_VERSION_3_1/GLES_DISPATCH_MAX_VERSION_3_2/g' host/gl/GLESVersionDetector.cpp
            echo "Patched GLESVersionDetector.cpp"
          else
            echo "Warning: GLESVersionDetector.cpp not found at expected path"
            find . -name "GLESVersionDetector.cpp" || true
          fi

      - name: Configure with CMake (ClangCL)
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -T ClangCL -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --target gfxstream_backend -j 4

      - name: Locate the DLL
        shell: bash
        run: |
          echo "=== Searching for DLL ==="
          find build -name "libgfxstream_backend.dll" -o -name "gfxstream_backend.dll" || true
          find build -name "*.dll" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgfxstream_backend-windows
          path: |
            build/**/libgfxstream_backend.dll
            build/**/gfxstream_backend.dll
            build/Release/*.dll
            build/Release/**/*.dll
          if-no-files-found: warn
          retention-days: 14
