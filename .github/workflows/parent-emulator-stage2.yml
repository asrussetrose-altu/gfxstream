        shell: pwsh
        timeout-minutes: 300
        run: |
          Set-Location C:\emu-master-dev\external\qemu
          Get-PSDrive C | Select-Object Used, Free
          if (-not (Test-Path C:\emu-master-dev\external\qemu\objs)) { Write-Output 'NO-OBJS-DIR-AFTER-CONFIGURE'; exit 1 }
          Write-Output '--- ninja check (same as Configure step) ---'
          where.exe ninja 2>&1 | Select-Object -First 3
          Write-Output '--- Compile with the verified feature flag (Configure already ran with it in the previous step) ---'
          cmd /c android\rebuild.cmd --ccache none --feature gfxstream_backend --task compile
          if ($LASTEXITCODE -ne 0) { Write-Output "COMPILE-EXIT-CODE: $LASTEXITCODE"; exit 1 }
          Write-Output 'COMPILE-OK'
          Get-PSDrive C | Select-Object Used, Free
      - name: Locate libgfxstream_backend.dll
        shell: pwsh
        run: |
          $found = Get-ChildItem C:\emu-master-dev\external\qemu\objs -Recurse -Filter libgfxstream_backend.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Write-Output "FOUND-COUNT: $($found.Count)"
          foreach ($f in $found) { $item = Get-Item $f; Write-Output "$f $($item.Length)" }
          if (-not $found) { Write-Output 'DLL-NOT-FOUND-UNDER-OBJS'; Get-ChildItem C:\emu-master-dev\external\qemu\objs -ErrorAction SilentlyContinue | Select-Object Name; exit 1 }
          $preferred = $found | Where-Object { $_ -like '*distribution*emulator*' } | Select-Object -First 1
          if (-not $preferred) { $preferred = $found | Select-Object -First 1 }
          Write-Output "DLL-SELECTED: $preferred"
          Copy-Item $preferred "$env:GITHUB_WORKSPACE\libgfxstream_backend.dll" -Force
          $item = Get-Item "$env:GITHUB_WORKSPACE\libgfxstream_backend.dll"
          Write-Output "DLL-SIZE: $($item.Length)"
          (Get-FileHash "$env:GITHUB_WORKSPACE\libgfxstream_backend.dll" -Algorithm SHA256).Hash
          Get-PSDrive C | Select-Object Used, Free
